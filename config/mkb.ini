# Mouse-look (MKB) configuration.
#
# Active when PS2X_MKB=1 (opt-in env); PS2X_MKB_CONFIG can point at any
# other file. Keys (see ps2xRuntime include/runtime/ps2_mkb.h):
#   sens       mouse pixels -> virtual right-stick deflection multiplier
#   deadzone   radial deadzone of the virtual right stick, 0..1
#   invert_y   1 flips the look Y axis
#
# Tuning note: the stick lives in [-1,1]; sens=1.0 (the built-in default)
# saturates on any real movement. sens=0.05 gives a steady turn at ~10
# px/frame; the per-frame re-center decay is a compiled constant
# (kMkbStickDecayPerFrame = 0.80).
[mkb]
sens=0.05
deadzone=0.1
invert_y=0
